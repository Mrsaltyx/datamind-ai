services:
  # Application complete (backend + frontend statique) en un seul conteneur
  datamind:
    build: .
    container_name: datamind-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=gemma4:e4b
    volumes:
      - datamind-data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  # LLM local (optionnel : desactivez ce service et utilisez une API distante)
  ollama:
    image: ollama/ollama:latest
    container_name: datamind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  datamind-data:
  ollama-models:
